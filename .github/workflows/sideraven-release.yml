name: Sideraven release

# SURFARK-HOOK: in this fork the workflow publishes Surfark Browser. Our tags are our own versions
# (v0.1.0 ...), never Sideraven's: do not push upstream's tags here, each one would publish a release.
# The secret names keep Sideraven's prefix so this file stays close to upstream; the key behind them
# is Surfark's own (docs/surfark/signing.md).
# A version tag (v1.0.0) builds the release, signs it with Sideraven's key and publishes it on
# GitHub Releases. The APK names stay the same every release, so Obtainium can track them.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: sideraven-release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 300
    name: Build, sign and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Signing secrets are set
        env:
          KEYSTORE: ${{ secrets.SIDERAVEN_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.SIDERAVEN_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIDERAVEN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIDERAVEN_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret $name is missing. See docs/surfark/signing.md; nothing is published unsigned." # SURFARK-HOOK
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Version from the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tags look like v1.0.0, not $GITHUB_REF_NAME"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FENIX_VERSION=$(tr -d '\n' < version.txt)" >> "$GITHUB_ENV"
          # SURFARK-HOOK: the Sideraven version this release is built on, for the release notes
          echo "SIDERAVEN_BASE=$(tr -d '\n' < automation/surfark/sideraven-base.txt)" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      # Fenix needs more disk than a runner starts with: remove toolchains we don't use.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          SWAP_DIR=$( [ -d /mnt ] && echo /mnt || echo / )
          sudo fallocate -l 6G $SWAP_DIR/sideraven-swap
          sudo chmod 600 $SWAP_DIR/sideraven-swap
          sudo mkswap $SWAP_DIR/sideraven-swap
          sudo swapon $SWAP_DIR/sideraven-swap
          df -h / $SWAP_DIR
          free -h

      - name: Install Android SDK with pieces Gradle skips
        run: |
          ./automation/iceraven/install-sdk.sh
          # apksigner, for signing below (the build would only fetch build-tools as a side effect).
          $HOME/android-sdk/android-sdk-linux/cmdline-tools/tools/bin/sdkmanager "build-tools;36.0.0"

      - name: Prepare checkout, release strings
        run: ./automation/sideraven/prepare.sh --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Lint vital is skipped: it once crashed on Sideraven's code with an internal lint error, and
      # every change is already built and tested by Sideraven CI before it is tagged.
      - name: Build forkRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"
        run: >
          ./gradlew app:assembleForkRelease -PversionName="$VERSION"
          -x lintVitalForkRelease -x lintVitalAnalyzeForkRelease -x lintVitalReportForkRelease
          --stacktrace --no-daemon

      - name: Sign the APKs
        env:
          KEYSTORE: ${{ secrets.SIDERAVEN_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.SIDERAVEN_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIDERAVEN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIDERAVEN_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/sideraven.jks"
          apksigner=$(ls -d "$HOME"/android-sdk/android-sdk-linux/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          for apk in gradle/build/app/outputs/apk/forkRelease/app-*-forkRelease-unsigned.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-forkRelease-unsigned\.apk$/\1/')
            out="dist/surfark-browser-$VERSION-$abi.apk" # SURFARK-HOOK
            "$apksigner" sign --ks "$RUNNER_TEMP/sideraven.jks" --ks-key-alias "$ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$apk"
            "$apksigner" verify "$out"
          done
          rm -f "$RUNNER_TEMP/sideraven.jks"
          # Checksums, so a download can be checked for corruption (sha256sum -c SHA256SUMS).
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # SURFARK-HOOK: in a fork, gh can pick the parent repository; publish in this one
          GH_REPO: ${{ github.repository }}
        run: |
          # The version's changelog (docs/changelog/<version>.md), when there is one, goes between the two lines.
          # SURFARK-HOOK: Surfark's wording, and its changelogs live in docs/surfark/changelog/<version>.md
          {
            echo "Surfark Browser $VERSION, based on Sideraven $SIDERAVEN_BASE and Firefox for Android $FENIX_VERSION."
            echo
            if [ -f "docs/surfark/changelog/$VERSION.md" ]; then
              cat "docs/surfark/changelog/$VERSION.md"
              echo
            fi
            echo "Download \`surfark-browser-$VERSION-arm64-v8a.apk\` for most devices, or \`armeabi-v7a\` for older 32-bit ones."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --title "Surfark Browser $VERSION" --notes-file notes.md
